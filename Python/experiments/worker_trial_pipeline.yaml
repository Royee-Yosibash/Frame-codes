sweep_pipeline:
  - call: dispatcher.reset

  - call: builtins.list
    assign: worker_configurations

  - for_each:
      values: "@worker_ids"
      as: worker_id
      steps:
        - call: frame_codes.coding_scheme.worker_nodes.operation_wrappers.with_deterministic_straggler
          args: ["@worker_operation"]
          assign: wrapped_worker_operation

        - call: operator.contains
          args: ["@straggler_worker_ids", "@worker_id"]
          assign: worker_is_straggler

        - call: functools.partial
          args: ["@wrapped_worker_operation"]
          kwargs:
            straggle: "@worker_is_straggler"
          assign: configured_worker_operation

        - call: frame_codes.coding_scheme.worker_nodes.worker_node.WorkerNodeConfig
          args: ["@configured_worker_operation", "@worker_calculation_type"]
          assign: worker_configuration

        - call: worker_configurations.append
          args: ["@worker_configuration"]

  - call: dispatcher.setup
    args: ["@worker_count", "@worker_configurations"]

  - call: dispatcher.dispatch
    args: ["@encoded_information"]
    assign: worker_results

  - call: decoder.decode
    args: ["@worker_results", "@code_family"]
    assign: decoded_blocks

  - call: numpy.concatenate
    args: ["@decoded_blocks"]
    kwargs:
      axis: 0
    assign: result
