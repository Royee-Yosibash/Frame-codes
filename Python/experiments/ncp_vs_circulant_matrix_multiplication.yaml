defaults:
  - setup/pipeline_setup
  - setup/matrix_multiplication_pipeline
  - _self_

results:
  trial:
    _target_: frame_codes.comparison.results.TrialMetrics
  experiment:
    _target_: frame_codes.comparison.results.ExperimentResult

init:
  _target_: builtins.dict

  code_parameters:
    _target_: frame_codes.coding_scheme.codes.code_parameters.CodeParameters
    m: 80
    n: 100

  matrix_rng:
    _target_: numpy.random.default_rng
    seed: 2026

  matrix_dimension: 160

pipeline:
  - lhs:
      call: matrix_rng.standard_normal
      kwargs:
        size: ["@matrix_dimension", "@matrix_dimension"]

  - rhs:
      call: numpy.linalg.inv
      kwargs:
        a: "@lhs"

  - reference_result:
      call: numpy.matmul
      args: ["@lhs", "@rhs"]

  - comparison_results:
      call: builtins.list

  - run: "@config.matrix_multiplication_setup_pipeline"

  - straggler_rng:
      call: numpy.random.default_rng
      kwargs:
        seed: "@config.sweep.straggler_seed"

  - straggler_sets:
      call: builtins.list

  - trial_indices:
      call: builtins.range
      args: ["@config.sweep.num_trials"]

  - for_each:
      values: "@trial_indices"
      steps:
        - sampled_stragglers:
            call: straggler_rng.choice
            kwargs:
              a: "@code_parameters.n"
              size: "@config.sweep.stragglers_per_trial"
              replace: false

        - sorted_stragglers:
            call: numpy.sort
            args: ["@sampled_stragglers"]

        - call: straggler_sets.append
          args: ["@sorted_stragglers"]

  - for_each:
      values: "@config.code_experiments"
      as: experiment
      steps:
        - experiment_rng:
            call: hydra.utils.instantiate
            args: ["@experiment.rng"]

        - code_family:
            call: frame_codes.code_families.factory.create_code_family
            kwargs:
              code_type: "@experiment.code_type"
              rng: "@experiment_rng"

        - run: "@config.code_input_pipeline"

        - worker_calculation_type:
            call: numpy.dtype
            kwargs:
              dtype: "@experiment.calculation_type"

        - trial_metrics:
            call: builtins.list

        - run: "@config.trial_sweep_pipeline"

        - for_each:
            values: "@trial_records"
            as: trial
            steps:
              - trial_metric:
                  call: hydra.utils.instantiate
                  args: ["@config.results.trial"]
                  kwargs:
                    expected_result: "@reference_result"
                    actual_result: "@trial.result"
                    trial_index: "@trial.trial_index"
                    straggler_worker_ids: "@trial.straggler_worker_ids"
                    responding_worker_ids: "@trial.responding_worker_ids"
                    worker_calculation_type: "@trial.worker_calculation_type"

              - call: trial_metrics.append
                args: ["@trial_metric"]

        - experiment_result_type:
            call: hydra.utils.get_method
            kwargs:
              path: "@config.results.experiment._target_"

        - experiment_result:
            call: experiment_result_type
            kwargs:
              name: "@experiment.name"
              code_type: "@experiment.code_type"
              n_nodes: "@worker_count"
              m_data_sets: "@code_parameters.m"
              worker_calculation_type: "@worker_calculation_type.name"
              trials: "@trial_metrics"

        - call: comparison_results.append
          args: ["@experiment_result"]

code_experiments:
  - name: Non consecutive powers
    code_type: Non consecutive powers
    calculation_type: complex128
    rng:
      _target_: numpy.random.default_rng
      seed: 29

  - name: Circulant Permutation
    code_type: Circulant Permutation
    calculation_type: float64
    rng: null

sweep:
  stragglers_per_trial: 10
  num_trials: 100
  straggler_seed: 2026
