name: Python tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Python

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and check dependencies
        run: python -m pip install -e ".[test,lint]"

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit_tests -p 'test_*.py' -v

      - name: Run comparison pipeline tests
        run: python -m unittest discover -s tests/pipeline_tests -p 'test_*.py' -v
